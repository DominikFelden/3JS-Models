<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#dddddd" />
  <title>3JS Models Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; overscroll-behavior: none; }
    canvas { display: block; touch-action: none; }
    #menu {
      position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left));
      background: rgba(255,255,255,.85); padding: 8px; border-radius: 6px;
      max-width: calc(100vw - 20px); box-sizing: border-box;
    }
    #menu select, #menu button { font-size: 16px; min-height: 36px; }
    #menu input[type=range] { width: 150px; vertical-align: middle; }
    @media (max-width: 600px) {
      #menu { left: 10px; right: 10px; top: auto; bottom: max(10px, env(safe-area-inset-bottom)); }
      #menu select { width: 60%; }
      #menu input[type=range] { width: 50%; }
    }
  </style>
</head>
<body>
  <div id="menu">
    <label>Model: <select id="select"></select></label>
    <div id="complexityRow" style="margin-top:6px">
      <label>Complexity: <input id="complexity" type="range" min="0" max="5" step="1" value="0" />
      <span id="complexityValue">0</span></label>
    </div>
    <div style="margin-top:6px"><button id="reroll">Re-roll (new random seed)</button> <span id="seed"></span></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
